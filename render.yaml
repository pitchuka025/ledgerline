services:
  - type: web
    name: ledgerline-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/ledgerline/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: ledgerline-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ledgerline-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: ledgerline-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: ledgerline-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ledgerline-db
          property: password
      - key: LEDGER_JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false

databases:
  - name: ledgerline-db
  - type: static
    name: ledgerline-frontend
    repo: https://github.com/pitchuka025/ledgerline
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ledgerline-api
          property: url
    plan: free
    region: singapore
    databaseName: ledgerline_db
    user: ledgerline_app
